<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>📚 StudyMate AI</h1>
            <p>Upload your PDF, generate summary and create quiz.</p>
        </div>

        <div class="card">

            <h2>Login</h2>

            <form id="loginForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="message"></p>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
